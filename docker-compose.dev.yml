services:
  db:
    container_name: db
    image: postgres:18-bookworm
    restart: always
    env_file:
      - backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: dev
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=debug
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app
      - /go/pkg/mod
      - ./backend/data:/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      target: dev
    command: ["npm", "run", "dev", "--", "--host"]
    environment:
      - VITE_API_TARGET=http://backend:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  llm-agent:
    container_name: llm-agent
    build: ./llm-agent
    restart: always
    environment:
      BACKEND_URL: "http://backend:8080"
      OLLAMA_HOST: "http://host.docker.internal:11434"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
